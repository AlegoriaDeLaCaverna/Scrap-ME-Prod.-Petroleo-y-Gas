[theme]
# Color principal para botones y acentos (Ejemplo: Un azul petrolero)
primaryColor = "000000"

# Color del fondo principal de la página
backgroundColor = "#0D3552"

# Color del panel lateral y cajas de fondo secundarias
secondaryBackgroundColor = "#f0f2f6"

# Color de las letras
textColor = "000000"

# Tipografía (Opciones permitidas: "sans serif", "serif", "monospace")
font = "monospace"
